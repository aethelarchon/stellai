<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Steinnebulas Dev</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05050f;color:#c8e8ff;font-family:-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:12px;background:#0a0a1f;border-bottom:1px solid #00e5ff33;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:15px;color:#00e5ff}
#settingsBtn{background:none;border:1px solid #00e5ff;color:#00e5ff;padding:6px 10px;border-radius:6px;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#1a2a4a;border:1px solid #00e5ff55}
.ai{align-self:flex-start;background:#0a1a2a;border:1px solid #7a4fff55}
.sys{align-self:center;background:#1a0a1a;color:#ff88aa;font-size:11px}
pre{background:#000;padding:8px;border-radius:6px;overflow-x:auto;font-size:11px;margin:6px 0}
#bar{padding:10px;background:#0a0a1f;border-top:1px solid #00e5ff33;display:flex;gap:8px}
#inp{flex:1;background:#05050f;border:1px solid #00e5ff55;color:#c8e8ff;padding:10px;border-radius:8px;font-size:13px;resize:none;outline:none;font-family:inherit}
#snd{background:#00e5ff;color:#05050f;border:none;padding:10px 16px;border-radius:8px;font-weight:bold}
#snd:disabled{opacity:.4}
#cfg{display:none;position:fixed;inset:0;background:#05050fee;padding:20px;z-index:100;flex-direction:column;gap:10px;overflow-y:auto}
#cfg input{background:#0a0a1f;border:1px solid #00e5ff55;color:#c8e8ff;padding:10px;border-radius:8px;font-size:13px;width:100%}
#cfg label{font-size:11px;color:#7a9fff;margin-top:6px}
#cfg button{background:#00e5ff;color:#05050f;border:none;padding:12px;border-radius:8px;font-weight:bold;margin-top:10px}
#cfg h3{color:#00e5ff;font-size:14px;margin-top:14px;border-bottom:1px solid #00e5ff33;padding-bottom:4px}
.apply{background:#7a4fff;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;margin-top:6px;cursor:pointer}
#restoreBtn{background:#ff4444;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;width:100%;margin-top:6px}
</style>
</head>
<body>
<header>
<h1>🌌 Steinnebulas Dev</h1>
<button id="settingsBtn">⚙️</button>
</header>
<div id="chat">
<div class="msg ai">স্বাগতম! ⚙️ থেকে Settings খুলে তিনটা API Key সেভ করুন: Gemini, OpenRouter, Groq। তারপর আমাকে বলুন কী ঠিক করতে হবে। একটার লিমিট শেষ হলে অটো অন্যটা চালু হবে।</div>
</div>
<div id="bar">
<textarea id="inp" rows="1" placeholder="যেমন: script.js এর বাগ ঠিক করো"></textarea>
<button id="snd">পাঠান</button>
</div>

<div id="cfg">
<h2 style="color:#00e5ff;font-size:16px">⚙️ Settings</h2>

<h3>🔵 Gemini API</h3>
<label>Gemini API Key (AIza...)</label>
<input id="gKey" type="password" placeholder="AIza...">

<h3>🟣 OpenRouter API</h3>
<label>OpenRouter API Key (sk-or-v1-...)</label>
<input id="oKey" type="password" placeholder="sk-or-v1-...">

<h3>🟢 Groq API</h3>
<label>Groq API Key (gsk_...)</label>
<input id="grKey" type="password" placeholder="gsk_...">

<h3>🐙 GitHub</h3>
<label>GitHub Token (ghp_...)</label>
<input id="ghToken" type="password" placeholder="ghp_...">
<label>GitHub Repo (username/repo)</label>
<input id="ghRepo" placeholder="user/my-repo">
<label>Branch নাম</label>
<input id="ghBranch" placeholder="main">

<button id="saveBtn">সেভ করুন</button>
<button id="restoreBtn">🚨 পুরনো কোড ফিরিয়ে আনুন</button>
<button id="closeBtn" style="background:#333;color:#c8e8ff;margin-top:4px">বন্ধ করুন</button>
</div>

<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),
snd=document.getElementById('snd'),cfg=document.getElementById('cfg');

const C={
gKey:localStorage.getItem('gKey')||'',
oKey:localStorage.getItem('oKey')||'',
grKey:localStorage.getItem('grKey')||'',
ghToken:localStorage.getItem('ghToken')||'',
ghRepo:localStorage.getItem('ghRepo')||'',
ghBranch:localStorage.getItem('ghBranch')||'main'
};

document.getElementById('settingsBtn').onclick=()=>{
gKey.value=C.gKey;oKey.value=C.oKey;grKey.value=C.grKey;
ghToken.value=C.ghToken;ghRepo.value=C.ghRepo;ghBranch.value=C.ghBranch;
cfg.style.display='flex';
};
document.getElementById('closeBtn').onclick=()=>cfg.style.display='none';
document.getElementById('saveBtn').onclick=()=>{
C.gKey=gKey.value.trim();C.oKey=oKey.value.trim();C.grKey=grKey.value.trim();
C.ghToken=ghToken.value.trim();C.ghRepo=ghRepo.value.trim();C.ghBranch=ghBranch.value.trim()||'main';
Object.keys(C).forEach(k=>localStorage.setItem(k,C[k]));
cfg.style.display='none';add('sys','✅ সব API Key সেভ হয়েছে');
};

function add(t,txt){
const d=document.createElement('div');d.className='msg '+(t==='user'?'user':t==='ai'?'ai':'sys');
d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function addCode(text){
const d=document.createElement('div');d.className='msg ai';
const parts=text.split(/```/);
d.innerHTML=parts.map((p,i)=>i%2?`<pre>${p.replace(/</g,'&lt;')}</pre>`:p).join('');
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}

async function gh(path,opt={}){
const r=await fetch('https://api.github.com'+path,{
...opt,
headers:{'Authorization':'token '+C.ghToken,'Accept':'application/vnd.github+json',...(opt.headers||{})}
});
if(!r.ok)throw new Error('GitHub '+r.status);
return r.json();
}
async function putFile(path,content){
let sha;
try{const d=await gh(`/repos/${C.ghRepo}/contents/${path}?ref=${C.ghBranch}`);sha=d.sha;}catch(e){}
const body={message:`AI fix: ${path}`,content:btoa(unescape(encodeURIComponent(content))),branch:C.ghBranch};
if(sha)body.sha=sha;
const r=await fetch(`https://api.github.com/repos/${C.ghRepo}/contents/${path}`,{
method:'PUT',
headers:{'Authorization':'token '+C.ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
body:JSON.stringify(body)
});
if(!r.ok)throw new Error('Commit failed');
return r.json();
}

// ============ 3টি AI প্রোভাইডার ============

// 1️⃣ Gemini
async function askGemini(prompt){
const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${C.gKey}`;
const r=await fetch(url,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
});
const d=await r.json();
if(d.error)throw new Error('Gemini: '+d.error.message);
return d.candidates[0].content.parts[0].text;
}

// 2️⃣ OpenRouter
async function askOpenRouter(prompt){
const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
method:'POST',
headers:{'Authorization':'Bearer '+C.oKey,'Content-Type':'application/json'},
body:JSON.stringify({
model:'google/gemini-2.0-flash-exp:free',
messages:[{role:'user',content:prompt}]
})
});
const d=await r.json();
if(d.error)throw new Error('OpenRouter: '+(d.error.message||JSON.stringify(d.error)));
return d.choices[0].message.content;
}

// 3️⃣ Groq
async function askGroq(prompt){
const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',
headers:{'Authorization':'Bearer '+C.grKey,'Content-Type':'application/json'},
body:JSON.stringify({
model:'llama-3.3-70b-versatile',
messages:[{role:'user',content:prompt}]
})
});
const d=await r.json();
if(d.error)throw new Error('Groq: '+d.error.message);
return d.choices[0].message.content;
}

// ============ মাল্টি-AI ফলব্যাক সিস্টেম ============
async function askAI(prompt){
const providers=[
{n:'Gemini',f:askGemini,key:C.gKey},
{n:'OpenRouter',f:askOpenRouter,key:C.oKey},
{n:'Groq',f:askGroq,key:C.grKey}
];
let lastErr=null;
for(const p of providers){
if(!p.key)continue;
try{
add('sys','🔄 '+p.n+' চেষ্টা করছি...');
const result=await p.f(prompt);
add('sys','✅ '+p.n+' সফল');
return result;
}catch(e){
add('sys','❌ '+p.n+' ব্যর্থ: '+e.message);
lastErr=e;
}
}
throw new Error('সব এআই ব্যর্থ হয়েছে: '+(lastErr?lastErr.message:'কোনো API Key নেই'));
}

// ============ Send Handler ============
snd.onclick=async()=>{
const text=inp.value.trim();
if(!text)return;
if(!C.ghToken||!C.ghRepo){add('sys','⚠️ আগে Settings-এ GitHub তথ্য দিন');return;}
if(!C.gKey&&!C.oKey&&!C.grKey){add('sys','⚠️ অন্তত একটা AI API Key দিন');return;}
inp.value='';add('user',text);snd.disabled=true;

const loading=add('ai','🔍 রিপো স্ক্যান করছি...');
try{
// ফাইল লিস্ট আনো
const tree=await gh(`/repos/${C.ghRepo}/git/trees/${C.ghBranch}?recursive=1`);
const files=tree.tree.filter(f=>f.type==='blob'&&/\.(html|css|js|jsx|ts|tsx|json|md)$/.test(f.path)).slice(0,10);

let ctx=`You are an expert AI developer working on repo "${C.ghRepo}".
User's command: "${text}"

Here are the repo files:
`;
for(const f of files){
try{
const d=await gh(`/repos/${C.ghRepo}/contents/${f.path}?ref=${C.ghBranch}`);
const c=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
ctx+=`\n--- FILE: ${f.path} ---\n${c.slice(0,2500)}\n`;
}catch(e){}
}
ctx+=`\n\nINSTRUCTIONS:
- Analyze the code and find what needs to be fixed based on user's command.
- Explain briefly what is wrong.
- If you need to change a file, output the FULL new file content in this exact format:
\`\`\`FILE: path/to/file.ext
<full new content here>
\`\`\`
- Only include files that need changes. Keep the fix minimal and safe.
- Do not remove unrelated code.`;

loading.textContent='🧠 AI ভাবছে... (একাধিক মডেল চেষ্টা করছে)';
const reply=await askAI(ctx);
loading.remove();
addCode(reply);

// ফাইল পার্স
const fixes=[];
const re=/```FILE:\s*([^\n]+)\n([\s\S]*?)```/g;
let m;
while((m=re.exec(reply))!==null)fixes.push({path:m[1].trim(),content:m[2]});

if(fixes.length>0){
const btn=document.createElement('button');
btn.className='apply';
btn.textContent=`✅ ${fixes.length}টি ফাইলে ফিক্স Apply করুন`;
btn.onclick=async()=>{
btn.disabled=true;btn.textContent='⏳ কমিট হচ্ছে...';
try{
for(const f of fixes)await putFile(f.path,f.content);
btn.textContent='✅ GitHub-এ কমিট হয়েছে!';
add('sys','🚀 ফিক্স কমিট হয়েছে। ১-২ মিনিটে লাইভ হবে।');
}catch(e){btn.textContent='❌ '+e.message;}
};
chat.appendChild(btn);chat.scrollTop=chat.scrollHeight;
}
}catch(e){
loading.remove();add('sys','❌ '+e.message);
}
snd.disabled=false;
};

inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();snd.click();}});

// ============ Restore Button ============
document.getElementById('restoreBtn').onclick=async()=>{
const file=prompt("যে ফাইল ফিরিয়ে আনতে চান (যেমন: script.js):");
if(!file)return;
const commit=prompt("পুরনো কমিটের SHA (যেমন: 86bddcd):");
if(!commit)return;
cfg.style.display='none';
try{
add('sys','⏳ পুরনো কোড আনা হচ্ছে...');
const r=await fetch(`https://api.github.com/repos/${C.ghRepo}/contents/${file}?ref=${commit}`,{
headers:{'Authorization':'token '+C.ghToken,'Accept':'application/vnd.github+json'}
});
const d=await r.json();
if(d.message)throw new Error(d.message);
const content=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
await putFile(file,content);
add('sys','✅ '+file+' সফলভাবে রিস্টোর হয়েছে!');
}catch(e){add('sys','❌ '+e.message);}
};
</script>
</body>
    </html>
